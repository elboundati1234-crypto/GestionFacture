<div class="client-container card shadow-sm p-4">
    <h2>Gestion des Clients</h2>

    <div class="add-form mb-4">
        <h3 class="border-bottom pb-2">Ajouter un nouveau client</h3>
        <form (ngSubmit)="addClient()" class="row g-3">
            <div class="col-md-5">
                <input 
                    type="text" 
                    placeholder="Prénom" 
                    [(ngModel)]="newClient.name" 
                    name="clientName"
                    class="form-control"
                    required
                />
            </div>
            <div class="col-md-5">
                <input 
                    type="text" 
                    placeholder="Nom" 
                    [(ngModel)]="newClient.lastName" 
                    name="clientLastName"
                    class="form-control"
                    required
                />
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Ajouter</button>
            </div>
        </form>
    </div>

    <hr>

    <h3 class="mt-4">Liste des Clients ({{ (clients$ | async)?.length || 0 }})</h3>
    
    <div class="table-responsive">
        <table *ngIf="(clients$ | async) as clients" class="table table-striped table-hover mt-3">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Prénom</th>
                    <th>Nom</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let client of clients">
                    <td>{{ client.id }}</td>
                    <td>{{ client.name }}</td>
                    <td>{{ client.lastName }}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" (click)="deleteClient(client.id)">Supprimer</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="!(clients$ | async)?.length" class="alert alert-info mt-3" role="alert">
        Aucun client enregistré.
    </div>
</div>
